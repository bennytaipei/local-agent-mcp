[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-mcp"
version = "0.1.0"
description = "Ops Floor MCP server (contract v0): list/launch/steer/status/await local agent slots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
local-agent-mcp = "local_agent_mcp.server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
